<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandas - Cocina</title>
<link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<header class="barra">
  <h1>Cocina</h1>
  <div class="sub" id="contador">Pedidos por preparar</div>
</header>

<main class="container">
  <div class="pestanas">
    <button class="btn pestana btn-primario" data-pestana="preparar">Por preparar</button>
    <button class="btn pestana" data-pestana="finalizados">Finalizados</button>
  </div>
  <div class="campo">
    <input type="text" id="buscador-cocina" placeholder="Buscar por numero, mesa, comprador o mesero..." autocomplete="off">
  </div>
  <section id="pestana-preparar">
    <div id="zona-pedidos"><div class="vacio">Esperando pedidos...</div></div>
  </section>
  <section id="pestana-finalizados-cocina" class="oculto">
    <div id="zona-finalizados"><div class="vacio">No hay pedidos finalizados.</div></div>
  </section>
</main>

<script src="/static/cocina.js?v=8"></script>
</body>
</html>
